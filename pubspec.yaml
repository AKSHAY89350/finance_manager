name: finance_manager
description: Personal Finance Manager — 100% Offline
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Charts
  fl_chart: ^0.68.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Date & Number Formatting (Indian ₹ format)
  intl: ^0.19.0

  # Calendar Date Picker
  table_calendar: ^3.0.9

  # Excel Export
  excel: ^4.0.2

  # File Sharing (WhatsApp, Email, Drive, etc.)
  share_plus: ^9.0.0

  # Unique IDs
  uuid: ^4.4.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
